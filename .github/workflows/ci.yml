name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      components: ${{ steps.scope.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_ci_scope.py'
          PYTHONDONTWRITEBYTECODE=1 python3 test/ci_scope.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  checks:
    # Fast development checks. Full acceptance is owned by the release workflow.
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        with:
          rust-cache-key: default-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          rust-components: rustfmt, clippy
      - name: Build and typecheck current runtime and tooling assets
        run: bun run build
      - name: Fast JavaScript and Gate tooling tests
        run: |
          bun run test:js:ci
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_gate.py'
      - name: SDK package pack inspection and isolated consumer smoke
        run: bun packages/sdk/scripts/inspect-package.ts
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: ./test/check-rust-clippy.sh
      - name: no-default-features
        run: cargo check --workspace --no-default-features
      - name: Rust 1.98 workspace and target compile check
        run: cargo +1.98.0 check --workspace --all-targets
      - name: metadata
        run: cargo metadata --no-deps --format-version 1
      - name: Production feature and artifact hygiene
        run: ./test/check-production.py
      - name: dependency boundaries
        run: ./test/check-boundaries.sh

  frontend-checks:
    needs: changes
    if: needs.changes.outputs.scope == 'frontend'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changed frontend packages
        env:
          COMPONENTS: ${{ needs.changes.outputs.components }}
        run: |
          set -euo pipefail
          case ",$COMPONENTS," in
            *,sdk,*)
              bun run --filter @open-compute/sdk typecheck
              bun run --filter @open-compute/sdk test
              bun packages/sdk/scripts/inspect-package.ts
              ;;
          esac
          case ",$COMPONENTS," in
            *,dashboard,*)
              bun run --filter @open-compute/dashboard format:check
              bun run --filter @open-compute/dashboard lint
              bun run --filter @open-compute/dashboard test
              bun run --filter @open-compute/dashboard build
              ;;
          esac
          case ",$COMPONENTS," in
            *,website,*) bun run --filter @open-compute/website build ;;
          esac
          case ",$COMPONENTS," in
            *,toolchain,*) bun run --filter @open-compute/toolchain build ;;
          esac

  docs-checks:
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Check documentation links and mirrors
        run: bun scripts/check-docs.ts

  ci:
    if: ${{ always() && !cancelled() }}
    needs: [changes, checks, frontend-checks, docs-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require development checks
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
        run: |
          set -euo pipefail
          test "${{ needs.changes.result }}" = success
          case "$SCOPE" in
            full) test "${{ needs.checks.result }}" = success ;;
            frontend) test "${{ needs.frontend-checks.result }}" = success ;;
            docs) test "${{ needs.docs-checks.result }}" = success ;;
            *) echo "unknown CI scope: $SCOPE" >&2; exit 1 ;;
          esac
