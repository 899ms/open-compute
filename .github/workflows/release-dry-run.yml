name: release-dry-run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to package
        required: true
        default: release
        type: string
      target:
        description: Native target to build; all runs the complete package matrix
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - darwin-arm64
          - all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unselected target
        if: inputs.target != 'all' && inputs.target != matrix.target
        run: echo "Skipping ${{ matrix.target }}; requested ${{ inputs.target }}"
      - uses: actions/checkout@v7
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          lfs: true
      - uses: ./.github/actions/setup-open-compute
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          rust-cache-key: dry-run-${{ matrix.target }}-${{ hashFiles('crates/storage/refinery-migrations/**/*.sql') }}
          rust-cache-save: "false"
          rust-cache-targets: "false"
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          version: v0.16.0
      - name: Restore bounded compiler cache
        id: compiler-cache
        if: inputs.target == 'all' || inputs.target == matrix.target
        uses: actions/cache/restore@v6
        with:
          path: .temp/sccache
          key: compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'packages/runtime/workerd.lock.json', 'crates/storage/refinery-migrations/**/*.sql') }}
          restore-keys: |
            compiler-v2-${{ runner.os }}-${{ runner.arch }}-rust1.98-sccache0.16-
      - name: Enable bounded compiler cache
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_DIR=$GITHUB_WORKSPACE/.temp/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=512M" >> "$GITHUB_ENV"
      - name: Package and verify native executable without publishing
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; found = 1 }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          revision="$(git rev-parse --verify HEAD)"
          destination="$RUNNER_TEMP/ocd-v$version-$RELEASE_TARGET"
          report="$GITHUB_WORKSPACE/.temp/release-report-$RELEASE_TARGET.json"
          mkdir -p .temp/dry-run-assets
          ./scripts/package-release.sh \
            --dest "$destination" \
            --archive "$OPEN_COMPUTE_BUILD_WORKERD_ARCHIVE" | tee "$report"
          REPORT="$report" VERSION="$version" REVISION="$revision" TARGET="$RELEASE_TARGET" \
            bun -e '
              const report = await Bun.file(process.env.REPORT).json();
              if (report.schemaVersion !== 1 || report.version !== process.env.VERSION
                  || report.revision !== process.env.REVISION || report.target !== process.env.TARGET)
                throw new Error("dry-run package identity mismatch");
            '
          OPEN_COMPUTE_TEST_OCD="$destination" ./test/gate.py single-binary --jobs 1
          cp "$destination" ".temp/dry-run-assets/ocd-v$version-$RELEASE_TARGET"
          cp "$report" ".temp/dry-run-assets/release-report-$RELEASE_TARGET.json"
      - name: Compiler cache statistics
        if: ${{ always() && (inputs.target == 'all' || inputs.target == matrix.target) }}
        run: sccache --show-stats
      - name: Save compiler cache
        if: ${{ always() && !cancelled() && (inputs.target == 'all' || inputs.target == matrix.target) && steps.compiler-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .temp/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: inputs.target == 'all' || inputs.target == matrix.target
        with:
          name: dry-run-${{ matrix.target }}
          path: .temp/dry-run-assets
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build and inspect SDK without publishing
        run: |
          bun run --filter @open-compute/sdk typecheck
          bun run --filter @open-compute/sdk test
          bun run --filter @open-compute/sdk build
          bun packages/sdk/scripts/inspect-package.ts
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-sdk
          path: .temp/sdk-package
          if-no-files-found: error
          retention-days: 3

  assemble:
    if: inputs.target == 'all'
    needs: [package, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-darwin-arm64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-linux-arm64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-linux-x64
          path: .temp/release-assets
      - uses: actions/download-artifact@v8
        with:
          name: dry-run-sdk
          path: .temp/sdk-package
      - name: Assemble and verify release manifest without publishing
        run: |
          set -euo pipefail
          version="$(awk '
            $0 == "[workspace.package]" { section = 1; next }
            section && /^\[/ { exit }
            section && /^version = / { value = $0; sub(/^version = "/, "", value); sub(/"$/, "", value); print value; found = 1 }
            END { if (!found) exit 1 }
          ' Cargo.toml)"
          mkdir -p .temp/assembled
          bun scripts/assemble-release.ts \
            --tag "v$version" \
            --dir "$GITHUB_WORKSPACE/.temp/release-assets" \
            --sdk-report "$GITHUB_WORKSPACE/.temp/sdk-package/sdk-package-report.json"
          cp .temp/release-assets/release.json .temp/assembled/
          cp .temp/release-assets/SHA256SUMS .temp/assembled/
          (cd .temp/release-assets && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: dry-run-assembled
          path: .temp/assembled
          if-no-files-found: error
          retention-days: 3
